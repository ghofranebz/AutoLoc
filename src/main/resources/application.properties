spring.application.name=autoloc-api

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
server.port=8081

# JPA : les entités ne sont plus sérialisées, le mapping DTO se fait dans la couche service (transaction)
spring.jpa.open-in-view=false

# Documentation OpenAPI / Swagger UI (springdoc)
# Swagger UI : http://localhost:8081/swagger-ui/index.html
# JSON OpenAPI : http://localhost:8081/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true

# Stratégie de tarification des contrats (OCP) : standard | longue-duree
autoloc.tarification=STANDARD
